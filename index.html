<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Райдер служения</title>
<meta name="theme-color" content="#2f5bd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Райдер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#f5f4f0;--card:#fff;--ink:#1d1c1a;--muted:#6f6b64;--line:#e4e1da;
  --acc:#2f5bd3;--acc-ink:#fff;--accsoft:#e8eefc;--ok:#1f8a4c;--oksoft:#e3f4ea;--bad:#c2352b;--badsoft:#fbe7e5;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--card:#1f1e1c;--ink:#eeece6;--muted:#a19d95;--line:#33312d;
  --acc:#7d9cf5;--acc-ink:#0f1320;--accsoft:#232b44;--ok:#5fcf8c;--oksoft:#1c3326;--bad:#f07c72;--badsoft:#3a201e;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
header.top .iconbtn{white-space:nowrap}
header.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
.banner{background:var(--accsoft);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner.bad{background:var(--badsoft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:0;background:var(--acc);color:var(--acc-ink);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.svc{display:flex;align-items:center;gap:12px;cursor:pointer}
.svc .date{width:52px;text-align:center;border-radius:10px;background:var(--accsoft);padding:6px 0;line-height:1.1}
.svc .date b{display:block;font-size:20px}
.svc .date span{font-size:12px;color:var(--muted)}
.svc h3{margin:0;font-size:16px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--oksoft);color:var(--ok);border-color:transparent}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;position:sticky;top:0;z-index:5}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input[type=text],input[type=date],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lu{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lu:first-child{border-top:0}
.lu .nm{font-weight:600}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--bg);width:34px;height:34px;cursor:pointer;font-size:18px}
.step span{min-width:30px;text-align:center;font-weight:600}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
.grp:first-child{margin-top:0}
.eq{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.eq.first{border-top:0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:16px;color:transparent}
.eq.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.eq.done .lbl{text-decoration:line-through;color:var(--muted)}
.eq .n{font-size:20px;font-weight:700;min-width:36px;text-align:right}
.short{display:block;font-size:12px;color:var(--bad)}
.why{display:block;font-size:12px;color:var(--muted)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--ok);width:0}
table.ch{width:100%;border-collapse:collapse;font-size:14px}
table.ch th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.ch td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.ch td.no{font-weight:700;width:34px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:18px}
.srcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.src{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.src b{display:block;font-size:14px}
.src span{font-size:12px;color:var(--muted)}
.src.on{border-color:var(--acc);background:var(--accsoft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30}
.empty{text-align:center;padding:30px 10px}
.stockrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.stockrow:first-child{border-top:0}
.stockrow input{width:84px;text-align:center}
.copybox{width:100%;min-height:160px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Загрузка…</p></div>
<script src="config.js"></script>
<script src="app.js"></script>
<script type="module">
const cfg = window.FIREBASE_CONFIG || {};
async function firebaseBackend(){
  const F = await import('./firebase.js'); const A = F; const { initializeApp } = F;
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { db = F.getFirestore(app); }
  // Анонимный вход: без паролей, но в базу пускаем только из приложения.
  const authed = new Promise((res) => {
    const off = A.onAuthStateChanged(auth, (u) => { if (u) { off(); res(u); } });
    A.signInAnonymously(auth).catch((e) => console.warn('auth', e));
  });
  return {
    kind: 'firebase',
    subscribe(team, onSvc, onInv, onErr) {
      let u1 = null, u2 = null, dead = false;
      authed.then(() => {
        if (dead) return;
        u1 = F.onSnapshot(F.collection(db, 'teams', team, 'services'),
          (snap) => onSvc(snap.docs.map((d) => Object.assign({ id: d.id }, d.data()))), onErr);
        u2 = F.onSnapshot(F.doc(db, 'teams', team, 'meta', 'inventory'),
          (snap) => onInv(snap.exists() ? snap.data() : null), onErr);
      });
      return () => { dead = true; if (u1) u1(); if (u2) u2(); };
    },
    async saveService(team, svc) { await authed; const b = Object.assign({}, svc); delete b.id;
      return F.setDoc(F.doc(db, 'teams', team, 'services', svc.id), b); },
    async deleteService(team, id) { await authed; return F.deleteDoc(F.doc(db, 'teams', team, 'services', id)); },
    async saveInv(team, inv) { await authed; return F.setDoc(F.doc(db, 'teams', team, 'meta', 'inventory'), inv); },
  };
}
(async () => {
  let be = null;
  if (cfg.apiKey && cfg.projectId) {
    try { be = await firebaseBackend(); } catch (e) { console.error('firebase', e); }
  }
  window.startApp(be || window.localBackend());
})();
</script>
</body>
</html>
